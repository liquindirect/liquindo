<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Reset password | Liquindo</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .reset-wrap { width: min(520px, calc(100% - 32px)); margin: 56px auto 80px; }
      .reset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: clamp(22px, 5vw, 36px); box-shadow: var(--shadow); }
      .reset-card h1 { margin-top: 0; }
      .reset-card p { color: var(--muted); }
      .reset-field { display: block; margin: 16px 0; font-weight: 700; }
      .reset-field input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: white; color: var(--ink); }
      .reset-password-wrap { display: flex; gap: 8px; align-items: stretch; margin-top: 6px; }
      .reset-password-wrap input { flex: 1; min-width: 0; margin-top: 0; }
      .reset-password-toggle { border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; background: #fff; color: var(--ink); cursor: pointer; }
      .reset-submit { width: 100%; border: 0; border-radius: 999px; padding: 12px 18px; margin-top: 8px; background: var(--teal); color: white; font-weight: 700; cursor: pointer; }
      .reset-message { min-height: 1.5em; overflow-wrap: anywhere; }
      .reset-back { display: inline-block; margin-top: 24px; color: var(--teal); font-weight: 700; }
    </style>
  </head>
  <body>
    <header class="page-header">
      <nav class="topbar" aria-label="Main navigation">
        <a class="brand" href="index.html">Liquindo</a>
        <div class="nav-links">
          <a href="login.html">Account login</a>
          <a href="members.html">Members</a>
        </div>
      </nav>
      <div class="page-title">
        <p class="eyebrow">Liquindo account</p>
        <h1>Reset your password</h1>
        <p>Choose a new password for your account.</p>
      </div>
    </header>
    <main class="reset-wrap">
      <section class="reset-card">
        <form id="reset-form">
          <label class="reset-field" for="new-password">New password
            <div class="reset-password-wrap">
              <input id="new-password" type="password" autocomplete="new-password" minlength="6" aria-describedby="password-requirements" required />
              <button class="reset-password-toggle" type="button" data-password-target="new-password" aria-controls="new-password" aria-pressed="false" aria-label="Show new password">Show</button>
            </div>
          </label>
          <p id="password-requirements">Use at least 6 characters. You can use the Show button to check what you typed.</p>
          <label class="reset-field" for="confirm-password">Confirm new password
            <div class="reset-password-wrap">
              <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required />
              <button class="reset-password-toggle" type="button" data-password-target="confirm-password" aria-controls="confirm-password" aria-pressed="false" aria-label="Show password confirmation">Show</button>
            </div>
          </label>
          <button class="reset-submit" id="reset-submit" type="submit">Save new password</button>
        </form>
        <p class="reset-message" id="reset-message" role="status" aria-live="polite"></p>
      </section>
      <a class="reset-back" href="login.html">← Back to account login</a>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
      const supabase = createClient(
        "https://uivjovkvpskvvazznlyr.supabase.co",
        "sb_publishable_-wytXeSX8qFAS46RZYBdVg_5atQ4xAz"
      );
      const form = document.querySelector("#reset-form");
      const password = document.querySelector("#new-password");
      const confirmPassword = document.querySelector("#confirm-password");
      const submit = document.querySelector("#reset-submit");
      const message = document.querySelector("#reset-message");
      document.querySelectorAll("[data-password-target]").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const field = document.getElementById(toggle.dataset.passwordTarget);
          const showing = field.type === "password";
          field.type = showing ? "text" : "password";
          toggle.textContent = showing ? "Hide" : "Show";
          toggle.setAttribute("aria-pressed", String(showing));
          toggle.setAttribute("aria-label", (showing ? "Hide " : "Show ") + (toggle.dataset.passwordTarget === "new-password" ? "new password" : "password confirmation"));
        });
      });
      function showMessage(text, error = false) {
        message.textContent = text;
        message.style.color = error ? "#b42318" : "var(--teal)";
      }
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const recoveryError = hash.get("error_description") || hash.get("error");
      if (recoveryError) showMessage("This recovery link is invalid or has expired. Request a new one from the login page.", true);
      const { data: { session } } = await supabase.auth.getSession();
      if (!session && !recoveryError) {
        showMessage("Open this page using the password recovery link sent to your email.", true);
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (password.value !== confirmPassword.value) {
          showMessage("The passwords do not match. Please try again.", true);
          confirmPassword.focus();
          return;
        }
        submit.disabled = true;
        showMessage("Updating your password…");
        try {
          const { data: { session: currentSession } } = await supabase.auth.getSession();
          if (!currentSession) throw new Error("Your recovery link may have expired. Request a new one from the login page.");
          const { error } = await supabase.auth.updateUser({ password: password.value });
          if (error) throw error;
          form.reset();
          showMessage("Your password has been changed successfully. You can now log in with your new password.");
          setTimeout(() => { window.location.href = new URL("login.html", window.location.href).href; }, 1800);
        } catch (error) {
          showMessage(error.message || "Could not update your password. Please try again.", true);
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
