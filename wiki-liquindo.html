<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquindo - Encyclopedia</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      .article-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px;
        line-height: 1.6;
        color: #333;
      }

      .article-header {
        margin-bottom: 30px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 20px;
      }

      .article-title {
        font-size: 2.5em;
        font-weight: bold;
        margin: 0 0 10px 0;
      }

      .article-subtitle {
        font-size: 1.2em;
        color: #666;
        font-style: italic;
        margin: 0;
      }

      .infobox {
        float: right;
        width: 300px;
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 15px;
        margin: 0 0 20px 20px;
        border-radius: 5px;
      }

      .infobox-title {
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
        margin-bottom: 10px;
        font-size: 1.1em;
      }

      .infobox-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
        font-size: 0.9em;
      }

      .infobox-label {
        font-weight: bold;
        color: #555;
      }

      .infobox-value {
        text-align: right;
      }

      .section {
        margin: 30px 0;
        clear: both;
      }

      .section-title {
        font-size: 1.8em;
        font-weight: bold;
        border-bottom: 2px solid #333;
        padding-bottom: 8px;
        margin-bottom: 15px;
      }

      .subsection-title {
        font-size: 1.3em;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 10px;
      }

      .faction-table {
        width: 100%;
        border-collapse: collapse;
        margin: 15px 0;
        font-size: 0.9em;
      }

      .faction-table th,
      .faction-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }

      .faction-table th {
        background: #f0f0f0;
        font-weight: bold;
      }

      a {
        color: #0645ad;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 15px;
        background: #f0f0f0;
        border-radius: 4px;
        text-decoration: none;
        color: #333;
        transition: background 0.3s;
      }

      .back-link:hover {
        background: #e0e0e0;
        text-decoration: none;
      }

      ul {
        margin: 15px 0;
        padding-left: 30px;
      }

      ul li {
        margin-bottom: 8px;
      }

      @media (max-width: 768px) {
        .infobox {
          float: none;
          width: 100%;
          margin: 0 0 20px 0;
        }

        .article-title {
          font-size: 1.8em;
        }
      }
    </style>
  </head>

          <p class="article-subtitle">The Federal Republic of Liquindo</p>
