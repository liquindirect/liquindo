    <script src="i18n.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const galleryFigures = document.querySelectorAll(
          ".gallery-page-grid figure"
        );

        const selectedImage =
          document.getElementById("selected-image");

        const selectedTitle =
          document.getElementById("selected-title");

        const selectedText =
          document.getElementById("selected-text");

        const selectedPanel =
          document.querySelector(".selected-gallery");

        const languageSwitcher =
          document.getElementById("language-switcher");

        function getImageDescription(imageNumber) {
          const key = `image.${imageNumber}`;

          if (window.languageManager) {
            return window.languageManager.get(key);
          }

          return (
            translations.en[key] ||
            translations.en["image.nodesc"] ||
            "No description has been added for this image yet."
          );
        }

        function updateSelectedDescription() {
          const selectedFigure =
            document.querySelector(
              ".gallery-page-grid figure.is-selected"
            );

          if (!selectedFigure) {
            return;
          }

          const imageNumber =
            selectedFigure.dataset.imageNumber;

          selectedText.textContent =
            getImageDescription(imageNumber);
        }

        function selectImage(figure) {
          const image =
            figure.querySelector("img");

          const imageNumber =
            figure.dataset.imageNumber;

          selectedPanel.hidden = false;

          selectedImage.src = image.src;
          selectedImage.alt = image.alt;

          selectedTitle.textContent =
            `Image ${imageNumber}`;

          selectedText.textContent =
            getImageDescription(imageNumber);

          galleryFigures.forEach((item) => {
            item.classList.remove("is-selected");
          });

          figure.classList.add("is-selected");

          selectedPanel.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }

        galleryFigures.forEach((figure) => {
          figure.tabIndex = 0;
          figure.setAttribute("role", "button");

          figure.addEventListener("click", () => {
            selectImage(figure);
          });

          figure.addEventListener(
            "keydown",
            (event) => {
              if (
                event.key === "Enter" ||
                event.key === " "
              ) {
                event.preventDefault();
                selectImage(figure);
              }
            }
          );
        });

        if (languageSwitcher) {
          languageSwitcher.addEventListener(
            "change",
            updateSelectedDescription
          );
        }
      });
    </script>
