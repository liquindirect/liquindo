    <script>
      const galleryFigures = document.querySelectorAll(".gallery-page-grid figure");
      const selectedImage = document.getElementById("selected-image");
      const selectedTitle = document.getElementById("selected-title");
      const selectedText = document.getElementById("selected-text");
      const selectedPanel = document.querySelector(".selected-gallery");
      const languageSwitcher = document.getElementById("language-switcher");

      function getImageDescription(imageNumber) {
        const key = `image.${imageNumber}`;
        const currentLang = languageSwitcher.value || 'en';
        
        if (translations[currentLang] && translations[currentLang][key]) {
          return translations[currentLang][key];
        }
        
        // Fallback to default language or "no description" message
        const fallbackKey = translations[currentLang] ? 'image.nodesc' : 'No description has been added for this image yet.';
        return translations[currentLang] && translations[currentLang][fallbackKey] 
          ? translations[currentLang][fallbackKey]
          : 'No description has been added for this image yet.';
      }

      galleryFigures.forEach((figure) => {
        figure.tabIndex = 0;

        function selectImage() {
          const image = figure.querySelector("img");
          const figcaption = figure.querySelector("figcaption").textContent;
          
          // Extract image number from "Image X" caption
          const imageNumber = figcaption.replace('Image ', '');

          selectedPanel.hidden = false;
          selectedImage.src = image.src;
          selectedImage.alt = image.alt;
          selectedTitle.textContent = figcaption;
          selectedText.textContent = getImageDescription(imageNumber);

          galleryFigures.forEach((item) => item.classList.remove("is-selected"));
          figure.classList.add("is-selected");
          selectedPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        figure.addEventListener("click", selectImage);
        figure.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectImage();
          }
        });
      });

      // Update image descriptions when language changes
      languageSwitcher.addEventListener("change", () => {
        const selectedFigure = document.querySelector(".gallery-page-grid figure.is-selected");
        if (selectedFigure) {
          const figcaption = selectedFigure.querySelector("figcaption").textContent;
          const imageNumber = figcaption.replace('Image ', '');
          selectedText.textContent = getImageDescription(imageNumber);
        }
      });
    </script>
